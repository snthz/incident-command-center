<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- ISOTIPO — Command Node (variante para fondo oscuro, sin rect de fondo) -->
  <g transform="translate(100,100)" stroke-linecap="round">

    <!-- órbita guía sutil -->
    <circle r="63" fill="none" stroke="#e8eefc" stroke-width="1.5"
            stroke-dasharray="2 7" opacity="0.25"/>

    <!-- conexiones -->
    <line x1="-19.5" y1="-9.5" x2="-46.5" y2="-22.5" stroke="#3b4a6b" stroke-width="4"/>
    <line x1="19.5"  y1="-9.5" x2="46.5"  y2="-22.5" stroke="#3b4a6b" stroke-width="4"/>
    <line x1="-13.5" y1="17.5" x2="-30.5" y2="39.5"  stroke="#3b4a6b" stroke-width="4"/>
    <line x1="13.5"  y1="17.5" x2="29"    y2="37.5"  stroke="#ff6b35" stroke-width="4.5"/>

    <!-- satélites (fill = surface del theme para enmascarar las líneas) -->
    <circle cx="-56" cy="-27" r="11" fill="#171717" stroke="#e8eefc" stroke-width="4"/>
    <circle cx="56"  cy="-27" r="11" fill="#171717" stroke="#e8eefc" stroke-width="4"/>
    <circle cx="-38" cy="49"  r="11" fill="#171717" stroke="#e8eefc" stroke-width="4"/>

    <!-- nodo incidente activo con doble pulso -->
    <circle cx="38" cy="49" r="12" fill="#ff6b35"/>
    <circle cx="38" cy="49" r="19" fill="none" stroke="#ff6b35" stroke-width="2.5" opacity="0.5"/>
    <circle cx="38" cy="49" r="26" fill="none" stroke="#ff6b35" stroke-width="1.5" opacity="0.25"/>

    <!-- nodo central: comando -->
    <circle r="24" fill="#e8eefc"/>
    <path d="M-8,2 L0,-7 L8,2 M0,-7 L0,11"
          stroke="#0b1220" stroke-width="4" fill="none" stroke-linejoin="round"/>
  </g>
</svg>
