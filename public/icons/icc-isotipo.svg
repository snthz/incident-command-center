<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- ISOTIPO — Command Node -->
  <g transform="translate(100,100)" stroke-linecap="round">

    <!-- órbita guía sutil (da sensación de sistema, no de nodos sueltos) -->
    <circle r="63" fill="none" stroke="#0b1220" stroke-width="1.5"
            stroke-dasharray="2 7" opacity="0.28"/>

    <!-- conexiones (nacen del borde del nodo central, mueren en el borde del satélite) -->
    <line x1="-19.5" y1="-9.5"  x2="-46.5" y2="-22.5" stroke="#aebad3" stroke-width="4"/>
    <line x1="19.5"  y1="-9.5"  x2="46.5"  y2="-22.5" stroke="#aebad3" stroke-width="4"/>
    <line x1="-13.5" y1="17.5"  x2="-30.5" y2="39.5"  stroke="#aebad3" stroke-width="4"/>
    <line x1="13.5"  y1="17.5"  x2="29"    y2="37.5"  stroke="#ff6b35" stroke-width="4.5"/>

    <!-- satélites (radio uniforme = 62 desde el centro) -->
    <circle cx="-56" cy="-27" r="11" fill="#ffffff" stroke="#0b1220" stroke-width="4"/>
    <circle cx="56"  cy="-27" r="11" fill="#ffffff" stroke="#0b1220" stroke-width="4"/>
    <circle cx="-38" cy="49"  r="11" fill="#ffffff" stroke="#0b1220" stroke-width="4"/>

    <!-- nodo incidente activo con doble pulso -->
    <circle cx="38" cy="49" r="12" fill="#ff6b35"/>
    <circle cx="38" cy="49" r="19" fill="none" stroke="#ff6b35" stroke-width="2.5" opacity="0.45"/>
    <circle cx="38" cy="49" r="26" fill="none" stroke="#ff6b35" stroke-width="1.5" opacity="0.2"/>

    <!-- nodo central: comando -->
    <circle r="24" fill="#0b1220"/>
    <circle r="24" fill="none" stroke="#ffffff" stroke-width="0" />
    <!-- flecha de comando, centrada ópticamente -->
    <path d="M-8,2 L0,-7 L8,2 M0,-7 L0,11"
          stroke="#ffffff" stroke-width="4" fill="none" stroke-linejoin="round"/>
  </g>
</svg>
