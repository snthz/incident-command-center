    <rect x="-72" y="-72" width="144" height="144" rx="32" fill="#141414" stroke="#141414" stroke-width="2.5"/>
    <g transform="translate(-4,0)">
      <path d="M-32,-28 L0,0 L-32,28" fill="none" stroke="#ffffff" stroke-width="13"/>
      <rect x="14" y="16" width="36" height="13" rx="6.5" fill="#ff6b35"/>
